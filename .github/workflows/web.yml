name: Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["viewer-web/**", "scripts/make_fixtures.py", "src/**", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["viewer-web/**", "scripts/make_fixtures.py", "src/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer-web
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer-web/package-lock.json
      # Fixtures need only the core dependencies; the dev group pulls wavpack-numcodecs, an sdist.
      - run: uv run --no-dev --frozen python -I scripts/make_fixtures.py
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      # The package build runs the app build through hatch_build.py; check the wheel carries it.
      - run: uv build -o "$RUNNER_TEMP/dist" && unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q static/viewer/viewer.js
        working-directory: .
