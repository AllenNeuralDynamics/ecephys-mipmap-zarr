[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecephys-mipmap-zarr"
description = "Tools to make mipmap zarrs for extracellular ephys"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.1.0"

dependencies = [
    "zarr>=3.0,<4",
    "numpy>=1.24",
    "dask[array]>=2024.1",
]

[project.optional-dependencies]
cli = ["tyro>=0.8", "rich"]
viewer = ["panel>=1.0", "bokeh>=3.0", "param"]
cbin = ["mtscomp"]
s3 = ["s3fs"]
wavpack = ["wavpack-numcodecs"]
si = [
    "spikeinterface @ git+https://github.com/alejoe91/spikeinterface@zarrv3",
    "scipy>=1.10",
    "wavpack-numcodecs",
    "numba>=0.59",
]

[project.scripts]
ecephys-mipmap = "ecephys_mipmap_zarr.cli:main"

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/ecephys-mipmap-zarr/"
Issues = "https://github.com/AllenNeuralDynamics/ecephys-mipmap-zarr/issues"
Changelog = "https://github.com/AllenNeuralDynamics/ecephys-mipmap-zarr/blob/main/CHANGELOG.md"

[dependency-groups]
types = ["mypy"]
dev = [
    { include-group = "types" },
    "codespell",
    "pytest",
    "pytest-cov",
    "ruff",
    "interrogate",
    "tyro>=0.8",
    "rich",
    "panel>=1.0",
    "bokeh>=3.0",
    "param",
    "mtscomp",
    "s3fs",
    "wavpack-numcodecs",
    "matplotlib>=3.10.8",
]
jupyter = [{ include-group = "dev" }, "ipykernel", "pip"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecephys_mipmap_zarr"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
# Skip all type annotation checks in tests
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 20 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "site",
]

[tool.commitizen]
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
major_version_zero = true

[tool.mypy]
files = ["src/ecephys_mipmap_zarr"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["zarr.*", "dask.*", "tyro.*", "rich.*", "panel.*", "bokeh.*", "param.*", "mtscomp.*", "s3fs.*", "wavpack_numcodecs.*", "fsspec.*", "spikeinterface.*"]
ignore_missing_imports = true
# zarr v3 generics are in flux; suppress type-arg errors in our build module
[[tool.mypy.overrides]]
module = ["ecephys_mipmap_zarr.build", "ecephys_mipmap_zarr.read", "ecephys_mipmap_zarr.cli", "ecephys_mipmap_zarr._store", "ecephys_mipmap_zarr._engine"]
disable_error_code = ["type-arg"]
# Bokeh/Panel type stubs are incomplete; relax checking for the viewer
[[tool.mypy.overrides]]
module = "ecephys_mipmap_zarr.viewer"
disallow_untyped_calls = false
disable_error_code = ["type-arg", "arg-type", "call-arg", "attr-defined", "unused-ignore", "assignment"]
